name: One-time NovaMine navigation fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'NovaMine navigation fix') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rewrite App
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("apps/web/src/App.jsx"); s=p.read_text()
          s=s.replace('const [showWithdraw,setShowWithdraw]=useState(false);','const [showWithdraw,setShowWithdraw]=useState(false);\\n  const [withdrawAddress,setWithdrawAddress]=useState("");\\n  const [withdrawBusy,setWithdrawBusy]=useState(false);\\n  const [withdrawError,setWithdrawError]=useState("");')
          s=s.replace('onClick={()=>setTab("profile")}','onClick={()=>setTab("bonus")}')
          old='''  const navItems=[
    {id:"home",icon:"home",label:"Home"},
    {id:"tasks",icon:"tasks",label:"Tasks"},
    {id:"team",icon:"users",label:"Refer"},
    {id:"wallet",icon:"wallet",label:"Wallet"},
    {id:"profile",icon:"user",label:"Profile"},
  ];'''
          new='''  const navItems=[
    {id:"home",icon:"home",label:"Home"},
    {id:"withdraw",icon:"wallet",label:"Withdraw"},
    {id:"history",icon:"rank",label:"History"},
    {id:"team",icon:"users",label:"Invite"},
    {id:"bonus",icon:"gift",label:"Bonus"},
  ];'''
          if old not in s: raise SystemExit("nav block not found")
          s=s.replace(old,new)
          a=s.index('        {tab==="tasks"&&<div>'); b=s.index('\n\n        {tab==="team"&&<div>',a)
          s=s[:a]+'''        {tab==="history"&&<div>
          <div style={{marginBottom:15}}><div style={{fontSize:25,fontWeight:800}}>History</div><div style={{fontSize:12,color:"#8d96a7"}}>Your recent earning activity</div></div>
          <div className="ex-card" style={{padding:18,marginBottom:12}}><div style={{display:"flex",justifyContent:"space-between",marginBottom:14}}><b>Current balance</b><b style={{color:"#18a76a"}}>{tonBalance.toFixed(5)} TON</b></div><div style={{display:"grid",gap:9}}><div style={{padding:13,borderRadius:13,background:"#f6f7fb",display:"flex",justifyContent:"space-between"}}><span>Mining rate</span><b>{miningPower.toLocaleString()}</b></div><div style={{padding:13,borderRadius:13,background:"#f6f7fb",display:"flex",justifyContent:"space-between"}}><span>Referrals</span><b>{refStats.total}</b></div><div style={{padding:13,borderRadius:13,background:"#f6f7fb",display:"flex",justifyContent:"space-between"}}><span>Active friends</span><b>{qualifiedFriends}</b></div></div></div>
          <div className="ex-card" style={{padding:18}}><b>Activity</b><div style={{padding:"28px 8px 12px",textAlign:"center",color:"#8d96a7",fontSize:12}}>Your real mining and withdrawal records will appear here as the account creates them.</div></div>
        </div>}''' + s[b:]
          a=s.index('        {tab==="wallet"&&<div>'); b=s.index('\n\n        {tab==="profile"&&<div>',a)
          s=s[:a]+'''        {tab==="withdraw"&&<div>
          <div style={{marginBottom:15}}><div style={{fontSize:25,fontWeight:800}}>Withdraw</div><div style={{fontSize:12,color:"#8d96a7"}}>Withdraw your available TON</div></div>
          <div className="ex-card" style={{padding:18,marginBottom:12}}><small style={{color:"#8d96a7"}}>Available balance</small><div style={{fontSize:34,fontWeight:800,margin:"4px 0 16px"}}>{tonBalance.toFixed(5)} TON</div>
            <div style={{padding:14,borderRadius:13,background:"#f6f7fb",marginBottom:12}}><div style={{fontSize:10,color:"#8d96a7",marginBottom:6}}>TON WALLET ADDRESS</div><input value={withdrawAddress} onChange={e=>{setWithdrawAddress(e.target.value);setWithdrawError("");}} placeholder="UQ... or EQ..." style={{width:"100%",border:0,outline:0,background:"transparent",fontFamily:"inherit",fontSize:14}}/></div>
            {withdrawError&&<div style={{padding:11,borderRadius:11,background:"#fff1f1",color:"#c62828",fontSize:11,marginBottom:10}}>{withdrawError}</div>}
            <button className="ex-btn" disabled={withdrawBusy||!withdrawAddress.trim()||tonBalance<=0} onClick={async()=>{setWithdrawBusy(true);setWithdrawError("");try{await api.requestWithdraw(tonBalance,withdrawAddress.trim());setTonBalance(0);setWithdrawAddress("");alert("Withdrawal request submitted.");}catch(e){setWithdrawError(e?.message||"Withdrawal request failed.");}finally{setWithdrawBusy(false);}}} style={{width:"100%",padding:14,borderRadius:14,background:"#5d57e9",color:"#fff",opacity:(withdrawBusy||!withdrawAddress.trim()||tonBalance<=0)?.55:1}}>{withdrawBusy?"Submitting…":"Withdraw TON"}</button>
          </div><div className="ex-card" style={{padding:16,fontSize:11,color:"#8d96a7"}}>Minimum withdrawal: {minWithdrawTon} TON · Referral requirement: 5 active friends.</div>
        </div>}''' + s[b:]
          a=s.index('        {tab==="profile"&&<div>'); b=s.index('\n      </main>',a)
          s=s[:a]+'''        {tab==="bonus"&&<div>
          <div style={{marginBottom:15}}><div style={{fontSize:25,fontWeight:800}}>Bonus</div><div style={{fontSize:12,color:"#8d96a7"}}>Claim your available welcome reward</div></div>
          <div className="ex-card" style={{padding:22,textAlign:"center",background:"linear-gradient(135deg,#f0efff,#ffffff)"}}><div style={{fontSize:58,marginBottom:8}}>🎁</div><div style={{fontSize:20,fontWeight:800}}>Welcome Bonus</div><div style={{fontSize:12,color:"#8d96a7",margin:"6px 0 18px"}}>Your account bonus</div><div style={{fontSize:36,fontWeight:800,color:"#5d57e9",marginBottom:18}}>+{welcomeTon} TON</div>
            {giftUnclaimed?<button className="ex-btn" onClick={async()=>{try{await api.claimGift?.();const fresh=await api.me();if(fresh?.user){setTonBalance(Number(fresh.user.ton_balance??0));setNova(Number(fresh.user.nova??0));setHashes(Number(fresh.user.hashes??0));setMiningPower(miningPowerFromNova(Number(fresh.user.nova??0)));}setGiftUnclaimed(false);}catch(e){setBuyError(e?.message||"Could not claim the bonus.");}}} style={{width:"100%",padding:14,borderRadius:14,background:"#5d57e9",color:"#fff"}}>Claim Bonus</button>:<div style={{padding:12,borderRadius:12,background:"#effbf6",color:"#18a76a",fontWeight:700}}>✓ Bonus already claimed</div>}
          </div>
        </div>}''' + s[b:]
          g=s.find('      {showGift&&<div style={{position:"fixed",inset:0,zIndex:1001')
          if g!=-1:
            e=s.find('      <header ',g)
            if e==-1: raise SystemExit("gift popup end not found")
            s=s[:g]+s[e:]
          s=s.replace('onClick={()=>{setGiftOpened(false);setShowGift(true)}}','onClick={()=>setTab("bonus")}')
          w=s.find('      {showWithdraw&&<WithdrawModal')
          if w!=-1:
            e=s.find('\n    </div>\n  );',w)
            if e==-1: raise SystemExit("withdraw modal end not found")
            s=s[:w]+s[e:]
          s=s.replace('item.id==="tasks"?"☷":item.id==="team"?"👥":item.id==="wallet"?"▣":"●"','item.id==="withdraw"?"⇩":item.id==="history"?"◷":item.id==="team"?"👥":"🎁"')
          p.write_text(s)
          PY
      - name: Build
        run: npm install && npm run build:web
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/App.jsx
          git add -u .github/workflows/one-time-novamine-nav.yml || true
          git commit -m "NovaMine navigation fix" || exit 0
          git push
